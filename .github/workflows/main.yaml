name: main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash -l {0}
    permissions:
      contents: write
      pages: write

    steps:
    - uses: actions/checkout@v3

    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        environment-file: conda.yaml
        channels: conda-forge,nodefaults
        activate-environment: freecampus
        auto-update-conda: true
        conda-solver: libmamba

    - name: Build the website
      run: |
        makim pages.build
        echo "freecampus.org" > build/CNAME

    - name: Check generated brand assets
      run: |
        python scripts/generate_brand_assets.py
        git diff --exit-code -- docs/assets/images

    - name: Check responsive branding
      run: |
        npm install --no-save --package-lock=false playwright@1.62.1
        npx playwright install --with-deps chromium
        python -m http.server 8000 --bind 127.0.0.1 --directory build &
        PREVIEW_PID=$!
        trap 'kill "$PREVIEW_PID"' EXIT
        node tests/brand-responsive.cjs

    - name: Save responsive screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: responsive-brand-previews
        path: test-results/
        if-no-files-found: ignore
        retention-days: 14

    # Push the website's HTML to github-pages
    - name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v3.5.9
      if: ${{ github.event_name == 'push' }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
